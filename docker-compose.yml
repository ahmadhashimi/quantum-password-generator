# Production: Caddy (TLS + reverse proxy) in front of the app. Only Caddy is exposed.
#   DOMAIN=quantumpass.example.com docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        WITH_IBM: "true"
    env_file: backend/.env
    environment:
      # `environment` overrides env_file, so these can't be accidentally replaced by dev values.
      ENVIRONMENT: production
      ALLOWED_HOSTS: '["${DOMAIN}", "localhost"]'
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      CLERK_HOSTS: '["https://clerk.${DOMAIN}"]'
      DATABASE_URL: sqlite:////data/qpg.db
      POOL_PATH: /data/entropy_pool.bin
      SIGNING_KEY_PATH: /data/signing_keys.json
      FORWARDED_ALLOW_IPS: 10.88.0.2
    volumes:
      - app-data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    expose: ["8000"]
    networks:
      edge:
        ipv4_address: 10.88.0.3

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 10.88.0.2

networks:
  edge:
    ipam:
      config:
        - subnet: 10.88.0.0/29

volumes:
  app-data:
  caddy-data:
  caddy-config:
