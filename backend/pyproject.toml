[project]
name = "quantum-password-generator"
version = "2.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
ibm = ["qiskit>=2.0", "qiskit-ibm-runtime>=0.42"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real QRNG services (needs network / API keys)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S101", "S311"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # backend/alembic/ holds migrations, not the package

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qiskit.*", "qiskit_aer.*", "qiskit_ibm_runtime.*"]
ignore_missing_imports = true
