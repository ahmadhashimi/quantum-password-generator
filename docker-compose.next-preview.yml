# Non-production preview. Does not replace docker-compose.yml; Postgres migration is pending.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      ENVIRONMENT: production
      ALLOWED_HOSTS: '["${DOMAIN}", "localhost"]'
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      CLERK_HOSTS: '["https://clerk.${DOMAIN}"]'
      DATABASE_URL: sqlite:////data/qpg.db
      POOL_PATH: /data/entropy_pool.bin
      SIGNING_KEY_PATH: /data/signing_keys.json
      FORWARDED_ALLOW_IPS: 10.89.0.2
    volumes: [api-data:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["8000"]
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 10.89.0.3
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      API_INTERNAL_ORIGIN: http://api:8000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["3000"]
    restart: unless-stopped
    networks: [internal]
    depends_on: [api]
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile.next:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 10.89.0.2
networks:
  internal:
    ipam:
      config:
        - subnet: 10.89.0.0/29
volumes:
  api-data:
  caddy-data:
  caddy-config:
