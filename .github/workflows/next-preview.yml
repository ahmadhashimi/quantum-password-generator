name: Next.js preview checks (non-release)

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/next-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # TEMPORARY: install generates a candidate lockfile; npm ci replaces this after lock review.
      - run: npm install --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      # Print the proposed lockfile for review/reproducibility, not as a deployment artifact.
      - name: Candidate lockfile for review
        run: |
          echo 'CANDIDATE_LOCK_START'
          cat package-lock.json
          echo 'CANDIDATE_LOCK_END'
