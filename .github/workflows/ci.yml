name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-ibm.lock
      - run: pip install -r requirements-dev.txt qiskit-aer
      - run: ruff check .
      - run: pytest
      - run: bandit -q -r app -s B104
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock -r requirements-ibm.lock

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qpg_test
          POSTGRES_USER: qpg_test
          POSTGRES_PASSWORD: qpg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qpg_test -d qpg_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      QPG_TEST_POSTGRES: "1"
      PG_TEST_ADMIN_DSN: "postgresql://qpg_test:qpg_test@localhost:5432/qpg_test"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-ibm.lock
      - run: pip install -r requirements-dev.txt qiskit-aer
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t qpg .
