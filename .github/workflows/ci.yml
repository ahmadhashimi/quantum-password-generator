name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

env:
  PG_IMAGE: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea

jobs:
  backend:
    name: backend (SQLite) — lint, types, tests, security scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-ibm.lock
      - run: pip install -r requirements-dev.txt qiskit-aer
      - run: ruff check .
      - run: mypy --strict app
      - run: pytest
      - name: OpenAPI snapshot is current (web types are generated from it)
        run: python -m scripts.export_openapi --check
      - run: bandit -q -r app -s B104
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock -r requirements-ibm.lock

  backend-postgres:
    name: backend (PostgreSQL 16) — tests and restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: qpg_test
          POSTGRES_USER: qpg
          POSTGRES_PASSWORD: qpg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qpg -d qpg_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QPG_TEST_DATABASE_URL: postgresql+psycopg://qpg:qpg@localhost:5432/qpg_test
      PGHOST: localhost
      PGUSER: qpg
      PGPASSWORD: qpg
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-ibm.lock
      - run: pip install -r requirements-dev.txt qiskit-aer
      - run: pytest
      - name: Backup and restore drill against a live API
        run: |
          set -euo pipefail
          sudo apt-get -qq install -y postgresql-client >/dev/null
          createdb qpg_src
          export ENVIRONMENT=development ALLOWED_HOSTS='["localhost","127.0.0.1"]' LOG_FORMAT=json \
                 DATABASE_URL=postgresql+psycopg://qpg:qpg@localhost:5432/qpg_src \
                 SIGNING_KEY_PATH=$RUNNER_TEMP/signing_keys.json POOL_PATH=$RUNNER_TEMP/pool.bin
          uvicorn app.main:app --port 8077 > $RUNNER_TEMP/api.log 2>&1 &
          for i in $(seq 30); do curl -fsS localhost:8077/api/v2/health && break; sleep 1; done
          for i in 1 2 3; do curl -fsS "localhost:8077/api/v2/password?receipt=true" > /dev/null; done
          id=$(curl -fsS -X POST -H 'content-type: application/json' -H 'Idempotency-Key: ci-restore-drill-1' \
               localhost:8077/api/v2/draws -d '{"title":"CI","entries":["a","b","c"],"winners":1}' \
               | python -c 'import json,sys; print(json.load(sys.stdin)["draw_id"])')
          curl -fsS -X POST localhost:8077/api/v2/draws/$id/run > /dev/null
          kill %1
          mkdir -p $RUNNER_TEMP/backups
          QPG_BACKUP_PASSPHRASE="ci restore drill passphrase" python -m scripts.keys backup \
            --key-file $RUNNER_TEMP/signing_keys.json --out $RUNNER_TEMP/backups/signing-key-ci.qpgkey
          pg_dump -d qpg_src --format=custom --no-owner > $RUNNER_TEMP/backups/qpg-ci.dump
          PYTHON=python ../deploy/restore-test.sh $RUNNER_TEMP/backups/qpg-ci.dump \
            $RUNNER_TEMP/backups/signing-key-ci.qpgkey postgresql+psycopg://qpg:qpg@localhost:5432/qpg_src

  web:
    name: web — types, lint, unit tests, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund
      - name: Generated API types match the OpenAPI snapshot
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e — Playwright against FastAPI + Next.js
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install --require-hashes --no-deps -r backend/requirements.lock
      - run: npm ci --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build the site with dev/e2e API rewrites
        run: npm run build
        working-directory: web
        env:
          API_REWRITE_ORIGIN: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    name: docker — images and compose topology
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t quantumpass-api:ci backend
      - run: docker build -t quantumpass-web:ci web
      - name: Validate compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env config --quiet
